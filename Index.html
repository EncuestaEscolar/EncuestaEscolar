<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Encuesta escolar sobre el uso del celular y la inteligencia artificial.">
<title>El celular, la inteligencia artificial y nosotros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{--blue:#0071e3;--blue2:#2997ff;--ink:#1d1d1f;--ink2:#424245;--mute:#6e6e73;--ease:cubic-bezier(.32,.72,0,1);--font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background:#f5f5f7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,textarea{font:inherit}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg span{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 26s ease-in-out infinite alternate}
.bg span:nth-child(1){background:#bfdcff;top:-20vmax;left:-15vmax}
.bg span:nth-child(2){background:#e6e6ff;bottom:-25vmax;right:-20vmax;animation-duration:32s}
.bg span:nth-child(3){background:#d6f3ea;top:30%;left:40%;animation-duration:38s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}
.topbar{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:rgba(245,245,247,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.05)}
.topbar-in{max-width:680px;margin:0 auto}
.topbar-row{display:flex;justify-content:space-between;font:500 13px var(--font);color:var(--mute);margin-top:8px}
.progress{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width .6s var(--ease)}
.app{max-width:680px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.screen{display:flex;flex-direction:column;gap:16px;animation:screenIn .7s var(--ease) both}
@keyframes screenIn{from{opacity:0;filter:blur(10px);transform:scale(.97) translateY(12px)}to{opacity:1;transform:none}}
.card{background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.07);padding:24px}
@media(min-width:640px){.card{padding:34px}}
.item{padding:18px 18px 14px;border-radius:22px}
.badge{display:inline-block;font:600 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:rgba(0,113,227,.09);padding:7px 12px;border-radius:99px}
h1{font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.08;letter-spacing:-.025em;margin:16px 0 0}
h2{margin:0}
.lead{font:500 16px/1.6 var(--font);color:var(--ink2);margin:0}
.muted{color:var(--mute);font-size:13px;font-weight:500;margin:14px 0 0;text-align:center}
.center{text-align:center}
.center h2{font-size:clamp(24px,5vw,30px);font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.qhead{display:flex;justify-content:space-between;gap:10px;font:600 12px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.qtitle{font-weight:600;font-size:clamp(20px,4.6vw,26px);line-height:1.28;letter-spacing:-.01em;margin-bottom:20px}
.opts{display:grid;gap:12px}
.opt{--rx:0deg;--ry:0deg;--s:1;position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;min-height:56px;border-radius:20px;border:1px solid rgba(0,0,0,.07);background:#fff;color:var(--ink);text-align:left;font:600 16px/1.35 var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05);transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s,background-color .3s}
.opt.press{--s:.965;transition-duration:.12s;box-shadow:inset 0 3px 8px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.05)}
.opt.sel{border-color:var(--blue);background:linear-gradient(180deg,#f2f8ff,#e8f2ff);box-shadow:0 0 0 1px var(--blue),0 12px 26px rgba(0,113,227,.16)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #c7c7cc;position:relative;transition:background-color .3s,border-color .3s}
.dot::after{content:"";position:absolute;top:3px;left:7px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .35s var(--ease)}
.sel .dot{background:var(--blue);border-color:var(--blue)}
.sel .dot::after{transform:rotate(45deg) scale(1)}
.why{display:grid;grid-template-rows:0fr;opacity:0;filter:blur(8px);scale:.98 .04;transform-origin:50% 0;visibility:hidden;margin-top:0;transition:grid-template-rows .4s var(--ease),opacity .25s ease,filter .25s ease,scale .4s var(--ease),margin-top .4s var(--ease),visibility 0s linear .4s}
.why.open{grid-template-rows:1fr;opacity:1;filter:blur(0px);scale:1 1;visibility:visible;margin-top:14px;transition:grid-template-rows .5s var(--ease),opacity .45s ease,filter .5s ease,scale .5s var(--ease),margin-top .5s var(--ease),visibility 0s}
.why .w{min-height:0;overflow:hidden}
.why-body{padding:6px}
.why-s{opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .25s var(--ease)}
.why.open .why-s{opacity:1;transform:none;transition:opacity .45s ease,transform .55s var(--ease)}
.why.open .why-s.b{transition-delay:.14s}
.why-l{display:block;margin:0 2px 8px;font:600 14px/1.4 var(--font);color:var(--ink2)}
.why-l small{font-weight:500;color:var(--mute)}
textarea{width:100%;min-height:96px;padding:14px 16px;border-radius:18px;border:1px solid #d2d2d7;background:rgba(255,255,255,.92);color:var(--ink);font:500 16px/1.5 var(--font);resize:vertical;outline:none;transition:border-color .25s,box-shadow .25s}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:0;border-radius:999px;font:600 16px var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s var(--ease),box-shadow .3s,background-color .3s}
.btn:active{transform:scale(.96)}
.btn-primary{color:#fff;background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:0 10px 24px rgba(0,113,227,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-ghost{color:var(--blue);background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.05)}
.btn-link{background:none;color:var(--blue);min-height:44px}
.btn.big{width:100%;min-height:58px;font-size:17px;margin-top:24px}
.wide{width:100%}
.nav{display:flex;gap:12px;margin-top:6px}
.nav .btn{flex:1}
.stack{display:grid;gap:12px}
.r{opacity:0;filter:blur(10px);scale:.94;translate:0 14px;transition:opacity .9s ease,filter .9s ease,scale 1s var(--ease),translate 1s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
.r.in{opacity:1;filter:blur(0px);scale:1;translate:0 0}
.err{margin:12px 4px 0;font:600 14px var(--font);color:#c9302c}
.err[hidden]{display:none}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.check{width:84px;height:84px;margin:6px auto 12px;display:block;fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .9s var(--ease) .2s forwards}
.check path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s var(--ease) .95s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ri-top{display:flex;gap:10px;align-items:flex-start;font:600 15px/1.4 var(--font);margin-bottom:8px}
.rn{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(0,113,227,.1);color:var(--blue);display:grid;place-items:center;font:700 12px var(--font)}
.ra{margin:0 0 4px 36px;font:500 15px/1.5 var(--font);color:var(--ink2);word-break:break-word;white-space:pre-line}
.ra.miss{color:#c9302c}
.rw{display:block;margin-top:6px;color:var(--mute);font-size:14px}
.link{background:none;border:0;padding:4px 0 0 36px;color:var(--blue);font:600 14px var(--font);cursor:pointer}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:3px}
.hint{margin:0;font:500 13px/1.5 var(--font);color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:20;background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:99px;font:500 14px var(--font);transition:transform .5s var(--ease);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .r{opacity:1;filter:none;scale:1;translate:0 0}
  .bg span{animation:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="topbar"><div class="topbar-in">
  <div class="progress" id="pb" role="progressbar" aria-label="Avance de la encuesta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="fill"></div></div>
  <div class="topbar-row"><span id="secName">Encuesta</span><span id="count"></span></div>
</div></header>
<main id="app" class="app"></main>
<div id="toast" class="toast" role="status"></div>
<script>
(() => {
"use strict";

/* ===== Configuración ===== */
// WhatsApp, formato internacional sin +, espacios ni guiones: 54 (Argentina) + 9 (celular) + 2494 022288
const WA_NUMBER = "5492494022288";
const WA_URL_MAX = 2000; // largo máximo del enlace ya codificado para mandar todo el mensaje de una vez
const TITLE = "El celular, la inteligencia artificial y nosotros";
const SECS = ["Uso del celular", "Uso de la inteligencia artificial", "Dependencia y pensamiento propio", "Opiniones y reflexión"];
const noIA = a => a[5]?.v === 3; // respondió «Nunca» en la pregunta 5

/* ===== Preguntas =====
   o: opciones (sin «o» = respuesta abierta)
   w: explicación «¿Por qué?» (on = índices de opción que la muestran)
   skip: condición para omitir la pregunta */
const Q = [
 {id:1, s:0, t:"¿Cuántas horas por día usás el celular?", o:["Menos de 2 horas","Entre 2 y 4 horas","Entre 4 y 6 horas","Más de 6 horas"]},
 {id:2, s:0, t:"¿Para qué usás más el celular?", o:["Redes sociales","Estudiar o hacer tareas","Hablar con otras personas","Jugar o mirar videos","Usar la IA","Otras cosas"], w:{on:[5], l:"¿Cuáles?"}},
 {id:3, s:0, t:"¿Te distraés con el celular cuando estás estudiando o haciendo una tarea?", o:["Sí, mucho","A veces","Casi nunca","Nunca"]},
 {id:4, s:0, t:"¿Sentís que usás demasiado el celular?", o:["Sí","No","A veces"], w:{on:[2], l:"¿En qué momentos sentís que lo usás demasiado?"}},
 {id:5, s:1, t:"¿Usás inteligencia artificial, como ChatGPT o Gemini?", o:["Sí, todos los días","Varias veces por semana","Casi nunca","Nunca"]},
 {id:6, s:1, t:"¿Para qué usás más la IA?", o:["Para hacer tareas","Para entender temas que no entiendo","Para buscar información","Para hacer imágenes o videos","Para pedir consejos o charlar","No la uso"], w:{on:[0,1,2,3,4], l:"¿Por qué la usás principalmente así?"}},
 {id:7, s:1, t:"Cuando usás IA para hacer una tarea, ¿qué hacés con las respuestas?", o:["Las leo y trato de entenderlas","Las uso como ayuda y escribo con mis palabras","Las copio directamente","Depende de la tarea"], w:{on:[3], l:"¿De qué depende? ¿Por qué?"}, skip:noIA},
 {id:8, s:1, t:"¿Alguna vez usaste IA para hacer una tarea sin intentar resolverla por tu cuenta primero?", o:["Sí, muchas veces","Sí, alguna vez","Casi nunca","Nunca"], skip:noIA},
 {id:9, s:1, t:"¿Creés que dependés mucho de la IA para estudiar o hacer trabajos?", o:["Sí","No","Un poco","No estoy seguro/a"], w:{on:[0,2,3], l:"¿Por qué? ¿En qué situaciones te pasa?"}, skip:noIA},
 {id:10, s:2, t:"¿Te costaría hacer una tarea si no pudieras usar la IA?", o:["Sí, bastante","Un poco","No, podría hacerla igual","No sé"], w:{on:[0,1,3], l:"¿Por qué?"}},
 {id:11, s:2, t:"¿Alguna vez copiaste una respuesta de la IA sin entenderla del todo?", o:["Sí, varias veces","Sí, alguna vez","Nunca"], skip:noIA},
 {id:12, s:2, t:"¿Creés que usar mucho la IA puede hacer que nos acostumbremos a no pensar tanto por nuestra cuenta?", o:["Sí","No","Depende de cómo la usemos","No sé"], w:{on:[0,1,2], l:"¿Por qué? ¿De qué depende?"}},
 {id:13, s:2, t:"¿Pensás que la IA nos ayuda a aprender o hace que nos esforcemos menos?", o:["Nos ayuda a aprender","Hace que nos esforcemos menos","Las dos cosas","Depende de cómo la usemos"], w:{on:[0,1,2,3], l:"¿Por qué elegiste esa respuesta?"}},
 {id:14, s:2, t:"¿Alguna vez te pasó que preferiste preguntarle a la IA antes que preguntarle a un profesor o compañero?", o:["Sí, muchas veces","Sí, alguna vez","Nunca"], w:{on:[0,1], l:"¿Por qué preferiste preguntarle a la IA?"}, skip:noIA},
 {id:15, s:3, t:"¿Revisás si la información que te da la IA es correcta?", o:["Siempre","A veces","Casi nunca","Nunca"], skip:noIA},
 {id:16, s:3, t:"¿Te parece que usamos demasiado el celular y la IA hoy en día?", o:["Sí","No","Depende de la persona"], w:{on:[0,1,2], l:"¿Por qué pensás eso?"}},
 {id:17, s:3, t:"¿Qué cosas buenas te parece que tiene la inteligencia artificial?"},
 {id:18, s:3, t:"¿Qué cosas negativas le encontrás al uso de la IA?"},
 {id:19, s:3, t:"¿Creés que estamos perdiendo la costumbre de pensar o resolver las cosas por nuestra cuenta por usar tanto la IA? ¿Por qué?"},
 {id:20, s:3, t:"¿Qué cambiarías de la forma en que usamos el celular o la inteligencia artificial?"}
];

/* ===== Estado y utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { screen: "cover", cur: 1, a: {} };
const app = $("#app");
const visible = () => Q.filter(q => !(q.skip && q.skip(state.a)));
const curQ = () => Q.find(q => q.id === state.cur);
const answered = q => {
  const x = state.a[q.id]; if (!x) return false;
  return q.o ? x.v !== undefined : !!(x.v && x.v.trim());
};
const entry = q => { // respuesta y explicación que corresponden a la respuesta actual
  if (!answered(q)) return null;
  const x = state.a[q.id];
  const ans = q.o ? q.o[x.v] : x.v.trim();
  const w = q.w && q.w.on.includes(x.v) && x.w && x.w.trim() ? x.w.trim() : null;
  return { ans, w };
};

/* ===== Mensaje de WhatsApp (un solo mensaje, nunca se recorta) ===== */
function fullMessage() {
  const blocks = visible().map(q => {
    const e = entry(q); if (!e) return null;
    return `${q.id}. ${q.t}\nRespuesta: ${e.ans}` + (e.w ? `\nExplicación: ${e.w}` : "");
  }).filter(Boolean);
  return `Encuesta: ${TITLE}\n\n` + blocks.join("\n\n");
}

/* ===== Plantillas ===== */
const cover = () => `<section class="screen">
  <div class="r" style="--d:0"><span class="badge">Encuesta escolar · 20 preguntas</span><h1>${esc(TITLE)}</h1></div>
  <div class="card r" style="--d:1">
    <p class="lead">Queremos conocer cómo usamos el celular y la inteligencia artificial, y qué pensamos sobre su influencia en el estudio y en nuestra forma de aprender. No hay respuestas correctas o incorrectas: respondé con sinceridad.</p>
    <button class="btn btn-primary big" data-act="start">Comenzar encuesta</button>
    <p class="muted">Tarda unos minutos. No pedimos nombre ni datos personales.</p>
  </div></section>`;

const why = (q, x) => {
  const on = q.w.on.includes(x.v);
  return `<div class="why${on ? " open" : ""}"${on ? "" : " inert"}><div class="w"><div class="why-body">
    <div class="why-s"><label class="why-l" for="w${q.id}">${esc(q.w.l)} <small>(opcional)</small></label></div>
    <div class="why-s b"><textarea class="why-f" id="w${q.id}" rows="3" maxlength="500" placeholder="Escribí lo que quieras">${esc(x.w || "")}</textarea></div>
  </div></div></div>`;
};

function question() {
  const v = visible(), q = curQ(), i = v.indexOf(q), x = state.a[q.id] || {};
  const body = q.o
    ? `<div class="opts" role="radiogroup" aria-labelledby="qt">${q.o.map((t, k) => `
        <div class="r" style="--d:${k + 1}"><button type="button" class="opt${x.v === k ? " sel" : ""}" role="radio" aria-checked="${x.v === k}" data-i="${k}"><span class="dot"></span><span>${esc(t)}</span></button></div>`).join("")}</div>${q.w ? why(q, x) : ""}`
    : `<div class="r" style="--d:2"><textarea id="open" rows="5" maxlength="800" aria-label="${esc(q.t)}" placeholder="Escribí tu respuesta">${esc(x.v || "")}</textarea></div>`;
  return `<section class="screen"><div class="card">
    <div class="qhead r" style="--d:0"><span>${SECS[q.s]}</span><span>Pregunta ${i + 1} de ${v.length}</span></div>
    <h2 id="qt" class="qtitle r" style="--d:0">${esc(q.t)}</h2>
    ${body}
    <p class="err" id="err" hidden></p>
    <div class="nav r" style="--d:4">
      <button class="btn btn-ghost" data-act="prev">Anterior</button>
      <button class="btn btn-primary" data-act="next">${i === v.length - 1 ? "Revisar respuestas" : "Siguiente"}</button>
    </div></div></section>`;
}

function review() {
  const v = visible();
  return `<section class="screen">
    <div class="card r" style="--d:0"><h2 class="qtitle" style="margin-bottom:8px">Revisá tus respuestas</h2>
      <p class="lead">Podés cambiar cualquiera antes de enviarlas. Las preguntas que no corresponden no aparecen.</p></div>
    <ol class="rlist">${v.map((q, k) => {
      const e = entry(q);
      return `<li id="ri-${q.id}"><div class="card item r" style="--d:${Math.min(k, 5)}">
        <div class="ri-top"><span class="rn">${q.id}</span><span>${esc(q.t)}</span></div>
        <p class="ra${e ? "" : " miss"}">${e ? esc(e.ans) : "Sin responder"}${e && e.w ? `<span class="rw">${esc(e.w)}</span>` : ""}</p>
        <button class="link" data-act="edit" data-id="${q.id}">Cambiar</button></div></li>`;
    }).join("")}</ol>
    <p class="err" id="err" hidden></p>
    <div class="nav r" style="--d:2"><button class="btn btn-ghost" data-act="back">Volver</button><button class="btn btn-primary" data-act="finish">Confirmar</button></div>
  </section>`;
}

function done() {
  return `<section class="screen">
    <div class="card center r" style="--d:0">
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
      <h2>¡Gracias por responder!</h2>
      <p class="lead">Tus respuestas nos ayudan a entender mejor cómo usamos la tecnología.</p>
    </div>
    <div class="card r" style="--d:2">
      <p class="lead" style="font-size:15px;margin-bottom:18px">Todas tus respuestas van en un solo mensaje a WhatsApp. Revisalo y tocá «Enviar».</p>
      <div class="stack">
        <button class="btn btn-primary wide" data-act="send">Enviar respuestas por WhatsApp</button>
        <p class="hint">Si el mensaje no aparece escrito en WhatsApp, mantené presionado el campo de texto, tocá «Pegar» y después «Enviar».</p>
        <button class="btn btn-ghost wide" data-act="copy">Copiar todas las respuestas</button>
        <button class="btn btn-link" data-act="review">Volver a revisar</button>
      </div>
    </div></section>`;
}

/* ===== Render y navegación ===== */
function render() {
  const v = visible();
  if (!v.some(q => q.id === state.cur)) state.cur = v[0].id;
  app.innerHTML = { cover, q: question, review, done }[state.screen]();
  refreshTop();
  window.scrollTo({ top: 0 });
  observe();
}
const go = s => { state.screen = s; render(); };

function refreshTop() {
  const v = visible(), n = v.filter(answered).length, q = curQ();
  const pct = state.screen === "cover" ? 0 : state.screen === "done" ? 100 : Math.round(n / v.length * 100);
  $("#fill").style.width = pct + "%";
  $("#pb").setAttribute("aria-valuenow", pct);
  $("#secName").textContent = state.screen === "q" ? SECS[q.s] : state.screen === "review" ? "Revisión" : state.screen === "done" ? "Envío" : "Encuesta";
  $("#count").textContent = state.screen === "q" ? `${v.indexOf(q) + 1} / ${v.length}` : "";
}

function showErr(msg) {
  const e = $("#err"); if (!e) return;
  e.textContent = msg; e.hidden = false;
  e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake");
  (document.querySelector(".qtitle") || e).scrollIntoView({ block: "center", behavior: "smooth" });
}

function choose(k) {
  const q = curQ(), x = (state.a[q.id] ??= {});
  x.v = k;
  app.querySelectorAll(".opt").forEach((b, j) => { b.classList.toggle("sel", j === k); b.setAttribute("aria-checked", j === k); });
  const err = $("#err"); if (err) err.hidden = true;
  if (q.w) {
    const on = q.w.on.includes(k), el = app.querySelector(".why");
    el.classList.toggle("open", on);
    el.toggleAttribute("inert", !on);
    if (on) setTimeout(() => el.scrollIntoView({ block: "nearest", behavior: "smooth" }), 420);
  }
  refreshTop();
}

function toast(msg, ms = 3200) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms);
}

function copyText(t) {
  const fallback = () => { // respaldo para navegadores sin API de portapapeles
    const ta = document.createElement("textarea"); ta.value = t; document.body.append(ta);
    ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
  };
  return navigator.clipboard ? navigator.clipboard.writeText(t).then(() => true, fallback) : Promise.resolve(fallback());
}

function copyAll() {
  copyText(fullMessage()).then(ok => toast(ok ? "Respuestas copiadas. Pegalas en WhatsApp." : "No se pudo copiar. Probá de nuevo.", 5000));
}

function sendAll() {
  const msg = fullMessage();
  const direct = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  if (direct.length <= WA_URL_MAX) return window.open(direct, "_blank", "noopener");
  // Mensaje demasiado largo para un enlace: se copia completo y se abre el chat para pegarlo una sola vez.
  copyText(msg).then(ok => toast(ok ? "Mensaje copiado. En el chat, pegalo y tocá «Enviar»." : "No se pudo copiar. Usá «Copiar todas las respuestas».", 8000));
  return window.open(`https://wa.me/${WA_NUMBER}`, "_blank", "noopener");
}

function act(name, el) {
  const v = visible(), i = v.indexOf(curQ());
  switch (name) {
    case "start": state.cur = v[0].id; return go("q");
    case "prev":
      if (i === 0) return go("cover");
      state.cur = v[i - 1].id; return render();
    case "next": {
      const q = v[i];
      if (!answered(q)) return showErr(q.o ? "Falta responder: elegí una opción para continuar." : "Falta responder: escribí una respuesta para continuar.");
      if (i === v.length - 1) return go("review");
      state.cur = v[i + 1].id; return render();
    }
    case "edit": state.cur = +el.dataset.id; return go("q");
    case "back": state.cur = v[v.length - 1].id; return go("q");
    case "finish": {
      const miss = v.find(q => !answered(q));
      if (miss) { state.cur = miss.id; go("q"); return showErr("Esta pregunta todavía no tiene respuesta."); }
      return go("done");
    }
    case "review": return go("review");
    case "send": return sendAll();
    case "copy": return copyAll();
  }
}

/* ===== Eventos ===== */
app.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt) return choose(+opt.dataset.i);
  const b = e.target.closest("[data-act]");
  if (b) act(b.dataset.act, b);
});

app.addEventListener("input", e => {
  const t = e.target; if (t.tagName !== "TEXTAREA") return;
  const x = (state.a[curQ().id] ??= {});
  if (t.id === "open") x.v = t.value; else x.w = t.value;
  refreshTop();
});

// Al escribir, la caja sube al centro de la pantalla para no quedar tapada por el teclado.
app.addEventListener("focusin", e => {
  if (e.target.tagName === "TEXTAREA") setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 350);
});

// Efecto 3D al tocar: se hunde al presionar y vuelve al soltar; inclinación sutil con el mouse.
const tilt = (b, rx = 0, ry = 0) => { b.style.setProperty("--rx", rx + "deg"); b.style.setProperty("--ry", ry + "deg"); };
app.addEventListener("pointerdown", e => e.target.closest(".opt")?.classList.add("press"));
const release = e => {
  const b = e.target.closest?.(".opt");
  if (!b || (e.relatedTarget && b.contains(e.relatedTarget))) return;
  b.classList.remove("press"); tilt(b);
};
app.addEventListener("pointerup", release);
app.addEventListener("pointercancel", release);
app.addEventListener("pointerout", release);
app.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const b = e.target.closest(".opt"); if (!b) return;
  const r = b.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  tilt(b, (-y * 7).toFixed(2), (x * 9).toFixed(2));
});

// Aparición al hacer scroll (blur + opacidad + escala), escalonada.
const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
}), { threshold: 0.1, rootMargin: "0px 0px -4% 0px" }) : null;
function observe() {
  document.querySelectorAll(".r:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in"));
}

render();
})();
</script>
</body>
</html>
